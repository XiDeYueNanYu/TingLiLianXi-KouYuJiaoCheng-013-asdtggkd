name: Update lessons
on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 03:00 sáng giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cập nhật lessons.json
        run: python scripts/update_lessons.py
        env:
          SHEET_ID: "13qbznoivv9QcLpR3AnlCRhvh_ENlygTQ0Vlmk4hI-xE"
          SHEET_TAB: "Data_update"
          JSON_COL: "B"
          FLAG_COL: "C"
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons.json
          git diff --cached --quiet || (git commit -m "Update lessons" && git push)
